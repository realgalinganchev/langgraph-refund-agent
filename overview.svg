<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <style>
      .actor{ fill: #f4f4f4; stroke: #555; stroke-width: 2; }
      .xs   { fill: #efe7fb; stroke: #6a3fb5; stroke-width: 2; }
      .lg   { fill: #eef3fb; stroke: #2f5d9e; stroke-width: 2; }
      .io   { fill: #fdf3e2; stroke: #c27a12; stroke-width: 2; }
      .edge { stroke: #444; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .abort{ stroke: #b42318; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrowr); }
      .t  { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
      .f  { font-size: 12px; fill: #555; text-anchor: middle; font-family: Consolas, monospace; }
      .b  { font-size: 13px; fill: #222; }
      .lbl{ font-size: 12px; fill: #222; font-weight: 600; text-anchor: middle; }
      .lr { font-size: 12px; fill: #b42318; font-weight: 600; text-anchor: middle; }
      .s  { font-size: 12px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="30" class="t" style="font-size:20px">How the two layers work together</text>

  <!-- people -->
  <rect x="16" y="105" width="124" height="64" rx="10" class="actor"/>
  <text x="78" y="134" class="t">Player</text>
  <text x="78" y="153" class="s">chat UI</text>

  <rect x="16" y="300" width="124" height="64" rx="10" class="actor"/>
  <text x="78" y="329" class="t" style="font-size:15px">Support agent</text>
  <text x="78" y="348" class="s">approves refunds</text>

  <!-- XState -->
  <rect x="250" y="70" width="250" height="340" rx="14" class="xs"/>
  <text x="375" y="98" class="t">Conversation · XState</text>
  <text x="375" y="117" class="f">src/conversation.ts</text>
  <text x="270" y="150" class="b">• one actor per chat</text>
  <text x="270" y="176" class="b">• which events are allowed now</text>
  <text x="270" y="196" class="b">   (no APPROVED unless pending)</text>
  <text x="270" y="222" class="b">• max 2 clarifying questions</text>
  <text x="270" y="248" class="b">• "give me a human" from any state</text>
  <text x="270" y="274" class="b">• leaving a state cancels the run</text>
  <text x="270" y="300" class="b">• final states end the chat</text>
  <text x="375" y="390" class="s" style="font-style:italic">guards the conversation</text>

  <!-- LangGraph -->
  <rect x="660" y="70" width="280" height="250" rx="14" class="lg"/>
  <text x="800" y="98" class="t">Agent · LangGraph</text>
  <text x="800" y="117" class="f">src/graph.ts</text>
  <text x="680" y="150" class="b">• classify intent (LLM in prod)</text>
  <text x="680" y="176" class="b">• CRM lookup, retry with backoff</text>
  <text x="680" y="202" class="b">• &gt; 5 EUR: pause with interrupt()</text>
  <text x="680" y="228" class="b">• refund with idempotency key</text>
  <text x="680" y="254" class="b">• recursion limit</text>
  <text x="800" y="300" class="s" style="font-style:italic">runs the agent</text>

  <!-- LangGraph dependencies -->
  <rect x="660" y="370" width="130" height="64" rx="10" class="io"/>
  <text x="725" y="397" class="t" style="font-size:14px">Checkpointer</text>
  <text x="725" y="416" class="s">paused state</text>
  <text x="725" y="430" class="s">per thread_id</text>

  <rect x="810" y="370" width="130" height="64" rx="10" class="io"/>
  <text x="875" y="397" class="t" style="font-size:14px">CRM</text>
  <text x="875" y="416" class="s">fake, src/crm.ts</text>
  <text x="875" y="430" class="s">read + refund</text>

  <path d="M725 320 L725 368" class="edge"/>
  <path d="M875 320 L875 368" class="edge"/>

  <!-- people <-> XState -->
  <path d="M140 128 L248 128" class="edge"/>
  <text x="194" y="104" class="lbl" style="font-size:11px">PLAYER_MESSAGE</text>
  <text x="194" y="119" class="lbl" style="font-size:11px">ASK_FOR_HUMAN</text>
  <path d="M248 156 L142 156" class="edge"/>
  <text x="194" y="180" class="s">replies</text>

  <path d="M140 332 L248 332" class="edge"/>
  <text x="194" y="308" class="lbl">APPROVED</text>
  <text x="194" y="323" class="lbl">REJECTED</text>

  <!-- XState <-> LangGraph -->
  <path d="M500 150 L658 150" class="edge"/>
  <text x="579" y="126" class="lbl">invoke(message)</text>
  <text x="579" y="141" class="lbl">Command({ resume })</text>

  <path d="M658 210 L502 210" class="edge"/>
  <text x="579" y="230" class="lbl">outcome: done | unclear</text>
  <text x="579" y="245" class="lbl">| needs approval | error</text>

  <path d="M500 290 L658 290" class="abort"/>
  <text x="579" y="281" class="lr">AbortSignal</text>
  <text x="579" y="308" class="s">player asks for a human</text>

  <!-- footer -->
  <text x="480" y="480" class="lbl" style="font-size:14px">XState decides what may happen next; LangGraph does the work; routing and money rules are code, not the model.</text>
  <text x="480" y="504" class="s">Details: conversation.svg (states) and graph.svg (nodes) below.</text>
</svg>
