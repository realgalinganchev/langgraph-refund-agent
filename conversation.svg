<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a3fb5"/>
    </marker>
    <style>
      .node { fill: #eef3fb; stroke: #2f5d9e; stroke-width: 2; }
      .run  { fill: #fdf3e2; stroke: #c27a12; stroke-width: 2; }
      .human{ fill: #efe7fb; stroke: #6a3fb5; stroke-width: 2; }
      .ok   { fill: #eaf6ee; stroke: #2e7d4f; stroke-width: 2; }
      .esc  { fill: #fde8e8; stroke: #b42318; stroke-width: 2; }
      .edge { stroke: #444; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .root { fill: none; stroke: #6a3fb5; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .redge{ stroke: #6a3fb5; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrowp); }
      .t  { font-size: 15px; font-weight: 600; fill: #111; text-anchor: middle; }
      .s  { font-size: 12px; fill: #444; text-anchor: middle; }
      .lbl{ font-size: 12px; fill: #222; font-weight: 600; }
      .pl { font-size: 12px; fill: #6a3fb5; font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="30" class="t" style="font-size:20px">Conversation layer (XState v5): one actor per chat</text>

  <!-- root-level handler: covers every non-final state -->
  <rect x="20" y="70" width="920" height="330" rx="14" class="root"/>
  <text x="36" y="92" class="pl">root on: ASK_FOR_HUMAN → escalated (works from any state inside this box)</text>

  <!-- initial -->
  <circle cx="44" cy="150" r="7" fill="#333"/>
  <path d="M51 150 L68 150" class="edge"/>

  <!-- listening -->
  <rect x="70" y="120" width="180" height="60" rx="10" class="node"/>
  <text x="160" y="146" class="t">listening</text>
  <text x="160" y="166" class="s">waits for the player</text>

  <!-- working -->
  <rect x="360" y="115" width="220" height="74" rx="10" class="run"/>
  <text x="470" y="139" class="t">working</text>
  <text x="470" y="157" class="s">invoke runGraph (LangGraph)</text>
  <text x="470" y="173" class="s">exit → AbortSignal cancels run</text>

  <!-- listening <-> working -->
  <path d="M250 138 L358 138" class="edge"/>
  <text x="258" y="130" class="lbl">PLAYER_MESSAGE</text>
  <path d="M360 168 L252 168" class="edge"/>
  <text x="262" y="186" class="lbl">unclear, &lt; 2 questions</text>
  <text x="262" y="200" class="s" style="text-anchor:start">ask a clarifying question</text>

  <!-- awaitingApproval -->
  <rect x="700" y="120" width="210" height="60" rx="10" class="human"/>
  <text x="805" y="146" class="t">awaitingApproval</text>
  <text x="805" y="166" class="s">graph paused by interrupt()</text>
  <path d="M580 140 L698 140" class="edge"/>
  <text x="596" y="132" class="lbl">needs approval</text>
  <text x="596" y="156" class="s" style="text-anchor:start">(&gt; 5 EUR)</text>

  <!-- resuming -->
  <rect x="700" y="290" width="210" height="74" rx="10" class="run"/>
  <text x="805" y="314" class="t">resuming</text>
  <text x="805" y="332" class="s">invoke resumeGraph</text>
  <text x="805" y="348" class="s">Command({ resume: yes | no })</text>
  <path d="M805 180 L805 288" class="edge"/>
  <text x="815" y="230" class="lbl">APPROVED / REJECTED</text>
  <text x="815" y="246" class="s" style="text-anchor:start">(ignored elsewhere)</text>

  <!-- final states (outside the box: a finished actor ignores all events) -->
  <rect x="330" y="470" width="200" height="60" rx="10" class="ok"/>
  <rect x="335" y="475" width="190" height="50" rx="7" fill="none" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="430" y="497" class="t">resolved</text>
  <text x="430" y="514" class="s">final</text>

  <rect x="660" y="470" width="250" height="60" rx="10" class="esc"/>
  <rect x="665" y="475" width="240" height="50" rx="7" fill="none" stroke="#b42318" stroke-width="1.2"/>
  <text x="785" y="497" class="t">escalated</text>
  <text x="785" y="514" class="s">final · "connecting you to a human"</text>

  <!-- working -> resolved -->
  <path d="M410 189 L410 468" class="edge"/>
  <text x="400" y="330" class="lbl" style="text-anchor:end">done</text>
  <text x="400" y="346" class="s" style="text-anchor:end">refunded / nothing missing</text>

  <!-- resuming -> resolved -->
  <path d="M700 340 L470 340 L470 468" class="edge"/>
  <text x="560" y="332" class="lbl">approved</text>

  <!-- resuming -> escalated -->
  <path d="M805 364 L805 468" class="edge"/>
  <text x="797" y="425" class="lbl" style="text-anchor:end">rejected</text>

  <!-- working -> escalated -->
  <path d="M560 189 L600 189 L600 500 L658 500" class="edge"/>
  <text x="608" y="215" class="lbl">unclear 3rd time</text>
  <text x="608" y="231" class="lbl">CRM down (onError)</text>

  <!-- root ASK_FOR_HUMAN -->
  <path d="M928 400 L928 500 L912 500" class="redge"/>
  <text x="816" y="440" class="pl">ASK_FOR_HUMAN</text>

  <!-- legend -->
  <text x="40" y="580" class="lbl">Final states stop the actor: later events (even ASK_FOR_HUMAN) are ignored. A new message is a new conversation.</text>
  <text x="40" y="602" class="s" style="text-anchor:start">XState decides which events are allowed now; LangGraph (graph.svg) does the work inside the orange states.</text>
  <rect x="40" y="620" width="14" height="14" class="node"/><text x="60" y="632" class="s" style="text-anchor:start">waiting</text>
  <rect x="130" y="620" width="14" height="14" class="run"/><text x="150" y="632" class="s" style="text-anchor:start">runs the graph</text>
  <rect x="260" y="620" width="14" height="14" class="human"/><text x="280" y="632" class="s" style="text-anchor:start">human decision</text>
  <rect x="390" y="620" width="14" height="14" class="ok"/><text x="410" y="632" class="s" style="text-anchor:start">resolved</text>
  <rect x="480" y="620" width="14" height="14" class="esc"/><text x="500" y="632" class="s" style="text-anchor:start">escalated</text>
</svg>
